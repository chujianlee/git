; ESP32-S3 语音 / 音频测试工程
;
; ⚠️ 本开发板用【外挂 CH340】做 USB 转串口（VID 1A86 / PID 7523），不是 S3 原生 USB，
;    所以绝对不能开 ARDUINO_USB_CDC_ON_BOOT，否则 Serial 输出会跑到没人的地方去。
;
; 实测硬件规格（esptool 读出）：
;   Chip  : ESP32-S3 (QFN56) rev v0.2
;   PSRAM : 8MB  (Embedded PSRAM, AP_3v3)  -> 足以跑 esp-sr 中文离线命令词
;   Flash : 16MB
;   XTAL  : 40MHz
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; 实测这个 ESP32-S3 板的 USB 是外挂 CH340，落在 COM4（可能随插拔变化）
upload_port = COM4
monitor_port = COM4

build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
